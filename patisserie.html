<script type="importmap">{"imports":{"three":"/assets/characters/vanilla-coconut-bunny/v002/preview/vendor/three.module.js","three/addons/":"/assets/characters/vanilla-coconut-bunny/v002/preview/vendor/","/assets/characters/vanilla-coconut-bunny/v002/preview/utils/BufferGeometryUtils.js":"/assets/characters/vanilla-coconut-bunny/v002/preview/vendor/BufferGeometryUtils.js"}}</script>
<script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/GLTFLoader.js';import {addConfectionReflections} from './src/art/lighting.js';
const names=['草莓','裱花奶油','马卡龙','巨型糖霜甜甜圈','草莓奶油树','棒棒糖树','马卡龙树','棉花糖树','葡萄糖果树','薄荷星星树','纸杯蛋糕岛','气球糖果岛','甜甜圈岛','马卡龙岛','甜品花园岛','马卡龙城堡','巧克力山','软糖小熊','蓝莓','巧克力','星星饼干','雨伞糖杖','纸杯蛋糕','彩虹糖星','糖星','糖果泡泡'];
const base='/assets/environment/patisserie/v002/',manifest=await(await fetch(base+'manifest.json')).json(),select=document.querySelector('select');
manifest.assets.forEach((a,i)=>select.add(new Option(names[i],a.id)));
const scene=new T.Scene();scene.background=new T.Color('#eadff1');const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
addConfectionReflections(scene,renderer);const camera=new T.PerspectiveCamera(38,1,.01,200);scene.add(new T.HemisphereLight('#fff9f3','#a4a3c8',1.35));const light=new T.DirectionalLight('#fff3dc',2.15);light.position.set(-4,8,6);scene.add(light);
const root=new T.Group();scene.add(root);let object,yaw=.25,pitch=.18,distance=5,serial=0;
async function show(){const ticket=++serial,model=await new GLTFLoader().loadAsync(base+select.value+'.glb');if(ticket!==serial)return;if(object)root.remove(object);object=model.scene;const box=new T.Box3().setFromObject(object),center=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3());const scale=4/Math.max(size.x,size.y,size.z);object.position.copy(center).multiplyScalar(-scale);object.scale.setScalar(scale);root.add(object);const a=manifest.assets.find(a=>a.id===select.value);document.querySelector('#details').textContent=`${a.triangles.toLocaleString()} 个三角面 · 纯色材质`;const link=document.querySelector('#download');link.href=base+select.value+'.glb';link.download=select.value+'.glb';window.galleryReady=true;}
select.onchange=show;select.value='macaron-palace';show();
let dragging=false,last;renderer.domElement.onpointerdown=e=>{dragging=true;last=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointerup=()=>dragging=false;renderer.domElement.onpointermove=e=>{if(dragging){yaw+=(e.clientX-last[0])*.007;pitch=Math.max(-1,Math.min(1,(pitch+(e.clientY-last[1])*.005)));last=[e.clientX,e.clientY];}};renderer.domElement.onwheel=e=>{e.preventDefault();distance=Math.max(3,Math.min(16,distance+e.deltaY*.005));};
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}onresize=resize;resize();
function frame(){requestAnimationFrame(frame);root.rotation.y=yaw;camera.position.set(0,Math.sin(pitch)*distance,Math.cos(pitch)*distance+3);camera.lookAt(0,0,0);renderer.render(scene,camera);}frame();
</script></html>
